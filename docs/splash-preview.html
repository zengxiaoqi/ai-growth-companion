<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵犀伴学 · 启动屏预览</title>
<style>
  :root{
    --deep:#241243; --g-top:#2A1650; --g-mid:#3D1F78; --g-low:#6B3FBE; --g-bottom:#9B57CE;
    --pink:#FF8FBE; --peri:#8E7BFF; --mint:#7FE7DA;
    --ease-out:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:flex; align-items:center; justify-content:center; gap:56px;
    background:radial-gradient(1200px 800px at 50% -10%, #1a1030 0%, #08050f 60%, #05030a 100%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#fff; -webkit-font-smoothing:antialiased;
  }
  .stage{display:flex;flex-direction:column;align-items:center;gap:22px}
  .phone{
    position:relative; width:390px; height:844px; border-radius:46px; overflow:hidden;
    background:var(--deep);
    box-shadow:0 60px 120px -30px rgba(124,60,220,.55), 0 0 0 10px #0e0a1a, 0 0 0 11px rgba(255,255,255,.07);
    isolation:isolate;
  }
  /* 状态栏 */
  .status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;
    justify-content:space-between;padding:14px 30px 0;font-size:13px;font-weight:600;letter-spacing:.4px;z-index:6;opacity:.92}
  .status .dots{display:flex;gap:4px;align-items:center}
  .status .bar{width:3px;border-radius:2px;background:#fff;opacity:.85}
  /* 背景层 */
  .bloom{position:absolute;inset:0;z-index:0;opacity:.45;
    background:linear-gradient(155deg, var(--g-top) 0%, var(--g-mid) 40%, var(--g-low) 72%, var(--g-bottom) 100%);
    animation:bloom 300ms var(--ease-out) forwards;}
  @keyframes bloom{to{opacity:1}}
  .glow{position:absolute;border-radius:50%;filter:blur(6px);z-index:1;mix-blend-mode:screen;pointer-events:none;opacity:0;
    animation:fadeIn 900ms 120ms ease-out forwards}
  .glow.pink{width:900px;height:900px;left:120px;top:520px;
    background:radial-gradient(circle, rgba(255,143,190,.42) 0%, rgba(255,143,190,0) 68%);
    animation:fadeIn 900ms 120ms ease-out forwards, drift 14s 1s ease-in-out infinite alternate}
  .glow.peri{width:760px;height:760px;left:-300px;top:-260px;
    background:radial-gradient(circle, rgba(142,123,255,.40) 0%, rgba(142,123,255,0) 70%)}
  .glow.mint{width:440px;height:440px;left:280px;top:80px;
    background:radial-gradient(circle, rgba(127,231,218,.22) 0%, rgba(127,231,218,0) 70%)}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes drift{from{transform:translate3d(-14px,-10px,0)} to{transform:translate3d(16px,12px,0)}}
  canvas#sky{position:absolute;inset:0;z-index:2;opacity:0;animation:fadeIn 1200ms 200ms ease-out forwards}
  .vignette{position:absolute;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(120% 88% at 50% 42%, rgba(0,0,0,0) 42%, rgba(0,0,0,.42) 100%)}
  /* 内容 */
  .content{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;
    padding:0 24px;justify-content:center}
  .logo-wrap{position:relative;width:132px;height:132px;margin-bottom:34px}
  .halo{position:absolute;left:50%;top:50%;width:400px;height:400px;margin:-200px 0 0 -200px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.30) 0%, rgba(255,143,190,.18) 52%, rgba(255,255,255,0) 72%);
    opacity:0;transform:scale(.6);animation:halo 1100ms 90ms var(--ease-out) forwards}
  @keyframes halo{to{opacity:1;transform:scale(1)}}
  .ripple{position:absolute;left:50%;top:50%;border-radius:50%;border:2px solid rgba(255,255,255,.18);
    filter:blur(1.6px);opacity:0;pointer-events:none}
  .ripple.r1{animation:ripple 2.2s 420ms cubic-bezier(.2,.7,.3,1) infinite}
  .ripple.r2{animation:ripple 2.2s 560ms cubic-bezier(.2,.7,.3,1) infinite}
  @keyframes ripple{
    0%{width:82px;height:82px;margin:-41px 0 0 -41px;opacity:0}
    12%{opacity:.55}
    70%,100%{width:290px;height:290px;margin:-145px 0 0 -145px;opacity:0}
  }

  @keyframes breathe{0%,100%{filter:drop-shadow(0 18px 34px rgba(120,50,200,.45))}
    50%{filter:drop-shadow(0 24px 46px rgba(255,143,190,.42))}}
  .shine{position:absolute;inset:0;border-radius:30px;overflow:hidden;pointer-events:none}
  .shine::after{content:"";position:absolute;top:-30%;left:-70%;width:38%;height:170%;
    background:linear-gradient(105deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 100%);
    transform:rotate(14deg);animation:sweep 6.4s 900ms cubic-bezier(.45,0,.2,1) infinite}
  @keyframes sweep{0%{left:-70%} 22%,100%{left:150%}}
  .spark{position:absolute;width:14px;height:14px;left:50%;top:50%;margin:-7px 0 0 -7px;
    background:#fff;clip-path:polygon(50% 0%,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0% 50%,42% 42%);
    filter:drop-shadow(0 0 8px rgba(255,255,255,.9));opacity:.9}
  .spark.s1{animation:orbit1 9s linear infinite}
  .spark.s2{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;animation:orbit2 7.2s linear infinite reverse;opacity:.75}
  .spark.s3{width:11px;height:11px;margin:-5.5px 0 0 -5.5px;animation:orbit3 11s linear infinite;opacity:.65}
  @keyframes orbit1{from{transform:rotate(0deg) translateX(114px) rotate(0deg)}
    to{transform:rotate(360deg) translateX(114px) rotate(-360deg)}}
  @keyframes orbit2{from{transform:rotate(120deg) translateX(124px) rotate(-120deg)}
    to{transform:rotate(480deg) translateX(124px) rotate(-480deg)}}
  @keyframes orbit3{from{transform:rotate(240deg) translateX(104px) rotate(-240deg)}
    to{transform:rotate(600deg) translateX(104px) rotate(-600deg)}}
  /* 字标 */
  .wordmark{display:flex;gap:4px;margin-bottom:16px}
  .wordmark span{font-size:31px;line-height:1.18;font-weight:700;letter-spacing:1px;
    text-shadow:0 0 26px rgba(255,143,190,.40), 0 3px 12px rgba(0,0,0,.35);
    opacity:0;transform:translateY(16px);animation:charIn 420ms var(--ease-out) forwards}
  .wordmark span:nth-child(1){animation-delay:540ms}
  .wordmark span:nth-child(2){animation-delay:656ms}
  .wordmark span:nth-child(3){animation-delay:773ms}
  .wordmark span:nth-child(4){animation-delay:890ms}
  @keyframes charIn{to{opacity:1;transform:translateY(0)}}
  .tagline{font-size:12.5px;letter-spacing:3.2px;font-weight:500;color:rgba(255,255,255,.78);
    opacity:0;transform:translateY(10px);animation:charIn 480ms 1116ms var(--ease-out) forwards}
  /* 底部加载 */
  .loading{position:absolute;left:0;right:0;bottom:46px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .loading .label{font-size:11.5px;letter-spacing:2.4px;color:rgba(255,255,255,.62);font-weight:500;
    opacity:0;animation:fadeIn 500ms 750ms ease-out forwards}
  .track{position:relative;width:118px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:visible;
    opacity:0;animation:fadeIn 500ms 700ms ease-out forwards}
  .fill{position:absolute;left:0;top:0;bottom:0;width:14%;border-radius:2px;
    background:linear-gradient(90deg, rgba(255,199,224,.9), #fff);
    animation:fill 1800ms 90ms cubic-bezier(.5,0,.2,1) forwards}
  @keyframes fill{to{width:92%}}
  .head{position:absolute;top:50%;left:14%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;
    background:#fff;box-shadow:0 0 12px 3px rgba(255,143,190,.9);animation:fill 1800ms 90ms cubic-bezier(.5,0,.2,1) forwards, pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
  .caption{font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.32)}
  .caption b{color:rgba(255,255,255,.6);font-weight:600}
  @media (max-width:520px){
    body{gap:0}
    .phone{width:100vw;height:100vh;border-radius:0;box-shadow:none}
    .caption{display:none}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="status"><span>9:41</span>
      <span class="dots">
        <span class="bar" style="height:6px"></span><span class="bar" style="height:9px"></span>
        <span class="bar" style="height:12px"></span><span class="bar" style="height:15px"></span>
      </span>
    </div>

    <div class="bloom"></div>
    <div class="glow peri"></div>
    <div class="glow pink"></div>
    <div class="glow mint"></div>
    <canvas id="sky"></canvas>
    <div class="vignette"></div>

    <div class="content">
      <div class="logo-wrap">
        <div class="halo"></div>
        <div class="ripple r1"></div>
        <div class="ripple r2"></div>
        <div class="logo"></div>
        <div class="shine"></div>
        <div class="spark s1"></div>
        <div class="spark s2"></div>
        <div class="spark s3"></div>
      </div>
      <div class="wordmark"><span>灵</span><span>犀</span><span>伴</span><span>学</span></div>
      <div class="tagline">AI 陪伴 · 共同成长</div>
    </div>

    <div class="loading">
      <div class="label">正在唤醒小灵犀</div>
      <div class="track"><div class="fill"></div><div class="head"></div></div>
    </div>
  </div>
  <div class="caption"><b>灵犀伴学</b> · 启动屏 Starlight 版</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  function resize(){
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  // 固定种子：与 Flutter 端一致的稳定星图
  let seed = 20261112;
  function rnd(){ seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  const stars = Array.from({length:72}, (_,i)=>({
    x:rnd(), y:rnd()*0.94,
    r: i%18===0 ? 3.2+rnd()*1.6 : 0.7+rnd()*1.1,
    phase:rnd()*Math.PI*2, speed:0.22+rnd()*0.55,
    alpha: i%18===0 ? 0.9 : 0.35+rnd()*0.5,
    big: i%18===0
  }));
  function sparkle(x,y,r,alpha,glow){
    ctx.save();
    ctx.globalAlpha = alpha;
    if(glow){
      const g = ctx.createRadialGradient(x,y,0,x,y,r*1.6);
      g.addColorStop(0,'rgba(255,255,255,.55)');
      g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x,y,r*1.6,0,Math.PI*2); ctx.fill();
    }
    ctx.beginPath();
    ctx.moveTo(x, y-r);
    ctx.quadraticCurveTo(x+r*.14, y-r*.14, x+r, y);
    ctx.quadraticCurveTo(x+r*.14, y+r*.14, x, y+r);
    ctx.quadraticCurveTo(x-r*.14, y+r*.14, x-r, y);
    ctx.quadraticCurveTo(x-r*.14, y-r*.14, x, y-r);
    ctx.closePath();
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.restore();
  }
  const t0 = performance.now();
  function frame(now){
    const t = ((now - t0) / 1000);
    ctx.clearRect(0,0,W,H);
    // 星野
    stars.forEach(s=>{
      const tw = 0.45 + 0.55*(0.5+0.5*Math.sin(t*Math.PI*2*s.speed + s.phase));
      const a = Math.min(1, s.alpha*tw);
      if(s.big) sparkle(s.x*W, s.y*H, s.r*2.6, a, true);
      else { ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r*1.25, 0, Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.globalAlpha=1; }
    });
    // 流星：每 9s 一次
    const cyc = (t % 9) / 9;
    const m = (cyc - 0.5) / 0.14;
    if(m >= 0 && m <= 1){
      const sx = W*0.98, sy = H*0.06, ex = W*0.32, ey = H*0.30;
      const hx = sx+(ex-sx)*m, hy = sy+(ey-sy)*m;
      const tm = Math.max(0, m-0.22);
      const tx = sx+(ex-sx)*tm, ty = sy+(ey-sy)*tm;
      const op = Math.sin(m*Math.PI)*0.9;
      const g = ctx.createLinearGradient(tx,ty,hx,hy);
      g.addColorStop(0,'rgba(255,255,255,0)');
      g.addColorStop(1,'rgba(255,255,255,'+op+')');
      ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(hx,hy); ctx.stroke();
    }
    requestAnimationFrame(frame);
  }
  resize(); window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
