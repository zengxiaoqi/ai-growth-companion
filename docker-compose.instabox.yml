services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: lingxi-backend
    user: root
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_PATH: /app/data/lingxi.db
    env_file:
      - .env
    volumes:
      - backend-data:/app/data
      - ./src/backend/public:/app/public
    networks:
      - lingxi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/contents"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./src/frontend-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: lingxi-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lingxi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  backend-data:
    driver: local

networks:
  lingxi-network:
    driver: bridge
