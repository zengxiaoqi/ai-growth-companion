<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6EA">
<title>打卡积分乐园 · 每天进步一点点</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<style>
/* ============================================================
   设计系统 · 奶油贴纸手账风
   ============================================================ */
:root {
  /* 纸与墨 */
  --paper: #FFF6EA;
  --paper-2: #FBF0DF;
  --surface: #FFFDF8;
  --surface-2: #FFF7E9;
  --ink: #4A3721;
  --ink-2: #8B7355;
  --ink-3: #B5A084;
  --line: #EFE1C9;
  --line-2: #E3D2B4;
  /* 语义色（贴纸色系） */
  --orange: #F08A3C; --orange-deep: #D9702A; --orange-soft: #FFEAD4;
  --blue: #5B87C9;   --blue-deep: #3F6DAF;   --blue-soft: #E7EFFA;
  --green: #6FAE5F;  --green-deep: #4E8C41;  --green-soft: #E9F3E4;
  --gold: #E9A23B;   --gold-deep: #C7861F;   --gold-soft: #FFF3DA;
  --berry: #D97A8E;  --berry-deep: #BB5A70;  --berry-soft: #FBEAEE;
  --danger: #D9534F; --danger-soft: #FBE9E8;
  /* 层级 */
  --shadow-s: 0 1px 2px rgba(112,80,40,.05), 0 3px 10px rgba(112,80,40,.06);
  --shadow-m: 0 2px 4px rgba(112,80,40,.06), 0 10px 24px rgba(112,80,40,.09);
  --shadow-l: 0 18px 48px rgba(112,80,40,.18);
  /* 圆角 / 间距 / 字号 / 缓动 */
  --r-s: 12px; --r-m: 18px; --r-l: 26px; --r-full: 999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px;
  --t-xs:12px; --t-sm:13px; --t-md:15px; --t-lg:17px; --t-xl:22px; --t-2xl:30px; --t-hero:46px;
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --ease-out: cubic-bezier(.22,.61,.36,1);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font); color: var(--ink); min-height: 100vh;
  background:
    radial-gradient(circle at 10% 6%, rgba(255,214,160,.38), transparent 30%),
    radial-gradient(circle at 92% 16%, rgba(215,231,255,.45), transparent 26%),
    radial-gradient(circle at 84% 84%, rgba(255,205,225,.28), transparent 32%),
    var(--paper);
  line-height: 1.55;
}
button { font-family: inherit; color: inherit; }
/* 可访问性：键盘焦点环 */
:focus-visible { outline: 3px solid rgba(91,135,201,.55); outline-offset: 2px; border-radius: 6px; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 布局 ---------- */
#app { max-width: 520px; margin: 0 auto; padding: var(--s4) var(--s4) 96px; }

/* ---------- 顶部 ---------- */
.top { display:flex; align-items:center; justify-content:space-between; padding: var(--s2) var(--s1) var(--s4); }
.brand { display:flex; align-items:center; gap:10px; }
.brand-badge {
  width:42px; height:42px; border-radius:14px; flex:0 0 auto;
  background: linear-gradient(140deg, #FFD79E, var(--orange));
  display:flex; align-items:center; justify-content:center; color:#fff;
  box-shadow: var(--shadow-s), inset 0 -3px 0 rgba(150,80,20,.18);
  transform: rotate(-4deg);
}
h1.brand-name { font-size: var(--t-lg); font-weight: 800; letter-spacing: .5px; line-height:1.2; }
.brand-sub { font-size: var(--t-xs); color: var(--ink-2); font-weight: 600; margin-top:1px; }
.icon-btn {
  width:42px; height:42px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-2);
  box-shadow: var(--shadow-s); transition: transform .15s var(--ease-out), background .15s;
}
.icon-btn:hover { background: var(--surface-2); color: var(--orange-deep); }
.icon-btn:active { transform: scale(.92); }

/* ---------- 孩子选择条 ---------- */
.kids { display:flex; gap:10px; overflow-x:auto; padding: var(--s2) var(--s1) var(--s4); scrollbar-width:none; }
.kids::-webkit-scrollbar { display:none; }
.kid {
  flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:78px;
  background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r-m); padding:10px 14px 8px;
  cursor:pointer; box-shadow: var(--shadow-s); position:relative;
  transition: transform .2s var(--ease-spring), border-color .15s, box-shadow .15s;
}
.kid .ava {
  width:44px; height:44px; border-radius:50%; font-size:23px; display:flex; align-items:center; justify-content:center;
  background: var(--surface-2); border:1.5px dashed var(--line-2); transition: background .2s;
}
.kid .nm { font-size: var(--t-xs); font-weight: 700; color: var(--ink-2); max-width:92px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.kid:hover { transform: translateY(-2px); }
.kid.on { border-color: var(--orange); border-style: solid; box-shadow: 0 0 0 3px rgba(240,138,60,.15), var(--shadow-m); transform: translateY(-2px); }
.kid.on .ava { background: var(--orange-soft); border-style: solid; border-color: #F8CFA4; }
.kid.on .nm { color: var(--orange-deep); font-weight: 800; }
/* 选中勾角标 */
.kid.on::after {
  content:'✓'; position:absolute; top:-7px; right:-6px; width:22px; height:22px; border-radius:50%;
  background: var(--green); color:#fff; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center;
  box-shadow: var(--shadow-s); animation: stampIn .3s var(--ease-spring);
}

/* ---------- 积分钱包卡（手账贴纸主角） ---------- */
.wallet {
  position:relative; background: var(--surface); border:1.5px solid var(--line); border-radius:var(--r-l);
  padding: var(--s6) var(--s5) var(--s5); box-shadow: var(--shadow-m); overflow:hidden; margin-bottom: var(--s4);
}
.wallet::before { /* 手账内框虚线 */
  content:''; position:absolute; inset:9px; border:1.5px dashed rgba(233,162,59,.30); border-radius:calc(var(--r-l) - 8px); pointer-events:none;
}
.tape { /* 和纸胶带 */
  position:absolute; top:-6px; left:50%; transform:translateX(-50%) rotate(-2.5deg);
  width:96px; height:26px; background:
    repeating-linear-gradient(45deg, rgba(240,138,60,.22) 0 7px, rgba(240,138,60,.10) 7px 14px),
    rgba(255,255,255,.55);
  border-left:1px dashed rgba(217,112,42,.25); border-right:1px dashed rgba(217,112,42,.25);
  box-shadow: 0 3px 8px rgba(150,100,40,.12); z-index:2;
}
.wallet-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: var(--s2); }
.wallet-label { font-size: var(--t-sm); font-weight:800; color:var(--ink-2); letter-spacing:1px; }
.streak {
  display:inline-flex; align-items:center; gap:4px; font-size:var(--t-xs); font-weight:800;
  color:var(--berry-deep); background:var(--berry-soft); border:1px solid #F3D2DA; border-radius:var(--r-full); padding:3px 10px;
}
.balance-row { display:flex; align-items:flex-end; gap:10px; margin-bottom: var(--s2); position:relative; z-index:1; }
.coin { color: var(--gold); display:flex; animation: coinBreathe 3.2s ease-in-out infinite; }
.balance-num { font-size: var(--t-hero); font-weight: 900; line-height:1; letter-spacing:-1px; color:var(--ink); }
.balance-unit { font-size: var(--t-md); font-weight:700; color:var(--ink-2); padding-bottom:6px; }
.wallet-stats { display:flex; gap: var(--s3); flex-wrap:wrap; font-size:var(--t-xs); color:var(--ink-2); position:relative; z-index:1; }
.wallet-stats b { color:var(--ink); font-weight:800; }
/* 本周打卡条 */
.week { display:flex; gap:5px; margin-top: var(--s4); position:relative; z-index:1; }
.wd { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; }
.wd i {
  width:100%; max-width:26px; height:8px; border-radius:var(--r-full); background:var(--paper-2); border:1px solid var(--line);
  transition: background .25s, border-color .25s, height .25s var(--ease-spring);
}
.wd.on i { background: linear-gradient(180deg, #F5B860, var(--gold)); border-color:#D9A243; height:12px; }
.wd.today i { box-shadow: 0 0 0 2px rgba(240,138,60,.28); }
.wd span { font-size:10px; font-weight:700; color:var(--ink-3); }
.wd.today span { color: var(--orange-deep); }

/* ---------- 主导航（底部 sticky） ---------- */
.tabbar {
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom)); z-index:60;
  display:flex; gap:4px; background:rgba(255,253,248,.94); backdrop-filter:blur(10px);
  border:1.5px solid var(--line); border-radius:var(--r-full); padding:5px; box-shadow: var(--shadow-m); width: calc(100% - 32px); max-width: 420px;
}
.tab {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; border:none; background:transparent;
  border-radius:var(--r-full); padding:7px 0 5px; font-size:11px; font-weight:700; color:var(--ink-3); cursor:pointer;
  position:relative; transition: color .18s, background .18s;
}
.tab svg { transition: transform .25s var(--ease-spring); }
.tab.on { color: var(--orange-deep); background: var(--orange-soft); }
.tab.on svg { transform: translateY(-1px) scale(1.08); }
.tab.on::before { content:''; position:absolute; top:2px; width:16px; height:3px; border-radius:2px; background:var(--orange); }

/* ---------- 分组标题 ---------- */
section.view { padding-top: var(--s2); animation: viewIn .28s var(--ease-out); }
.hide { display:none; }
.g-head { display:flex; align-items:center; gap:8px; margin: var(--s5) var(--s1) var(--s3); }
.g-badge {
  width:30px; height:30px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  background:var(--blue-soft); color:var(--blue-deep);
}
.g-badge.green { background:var(--green-soft); color:var(--green-deep); }
h2.g-title { font-size:var(--t-md); font-weight:800; letter-spacing:.5px; }
.g-count { margin-left:auto; font-size:var(--t-xs); font-weight:800; color:var(--ink-3); display:flex; align-items:center; gap:6px; }
/* 迷你环形进度 */
.ring { transform: rotate(-90deg); }
.ring-bg { fill:none; stroke:var(--line); stroke-width:2.5; }
.ring-fg { fill:none; stroke:var(--green); stroke-width:2.5; stroke-linecap:round; transition: stroke-dashoffset .5s var(--ease-out); }
.ring-fg.zero { stroke:var(--line-2); }

/* ---------- 打卡贴纸行 ---------- */
.habit {
  display:flex; align-items:center; gap: var(--s3); background:var(--surface); border:1.5px solid var(--line);
  border-radius:var(--r-m); padding:11px 14px; margin-bottom:10px; cursor:pointer; width:100%; text-align:left;
  box-shadow: var(--shadow-s); position:relative; overflow:hidden;
  transition: transform .2s var(--ease-spring), border-color .2s, box-shadow .2s, background .2s;
  animation: stickerIn .38s var(--ease-spring) both;
}
.habit:nth-child(2){animation-delay:.04s} .habit:nth-child(3){animation-delay:.08s} .habit:nth-child(4){animation-delay:.12s}
.habit:nth-child(5){animation-delay:.16s} .habit:nth-child(6){animation-delay:.20s} .habit:nth-child(7){animation-delay:.24s}
.habit:hover { transform: translateY(-2px); box-shadow: var(--shadow-m); }
.habit:active { transform: scale(.985); }
.h-emoji {
  width:48px; height:48px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:25px; flex:0 0 auto;
  background:var(--blue-soft); border:1.5px solid rgba(91,135,201,.18); transition: background .2s, border-color .2s, transform .3s var(--ease-spring);
}
.habit.green .h-emoji { background:var(--green-soft); border-color:rgba(111,174,95,.20); }
.h-main { flex:1; min-width:0; }
.h-name { font-size:var(--t-md); font-weight:700; line-height:1.4; }
.h-meta { display:inline-flex; align-items:center; gap:4px; font-size:var(--t-xs); font-weight:800; color:var(--gold-deep);
  background:var(--gold-soft); border-radius:var(--r-full); padding:1px 8px; margin-top:3px; }
/* 橡皮章 */
.stamp {
  width:40px; height:40px; border-radius:50%; border:2px dashed var(--line-2); background:transparent; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; color:var(--ink-3); transition: all .2s;
}
.stamp svg { opacity:.28; }
.habit.done { background: linear-gradient(180deg, #F4FAF0, var(--surface)); border-color:#CDE4C4; }
.habit.done .h-emoji { background:var(--green-soft); transform: rotate(-6deg); }
.habit.done .stamp { border:2.5px solid var(--green); color:var(--green-deep); background:rgba(111,174,95,.10); animation: stampIn .35s var(--ease-spring); }
.habit.done .stamp svg { opacity:1; }
.habit.done .h-name { color:var(--green-deep); }

/* ---------- 礼物橱窗 ---------- */
.r-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.r-card {
  position:relative; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r-l); padding:16px 12px 12px;
  text-align:center; cursor:pointer; box-shadow:var(--shadow-s); overflow:hidden;
  transition: transform .2s var(--ease-spring), box-shadow .2s, border-color .2s;
  animation: stickerIn .38s var(--ease-spring) both;
}
.r-card:nth-child(2n){animation-delay:.05s} .r-card:nth-child(3){animation-delay:.1s} .r-card:nth-child(4){animation-delay:.15s}
.r-card:hover { transform: translateY(-3px) rotate(-.4deg); box-shadow: var(--shadow-m); }
.r-card.available { border-color:#F2C99B; box-shadow: 0 0 0 3px rgba(240,138,60,.10), var(--shadow-s); }
.r-card.locked { background: var(--surface-2); }
.r-card.locked .r-emoji { filter: grayscale(.55); opacity:.7; }
.r-emoji {
  width:66px; height:66px; margin:2px auto 8px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px;
  background: radial-gradient(circle at 32% 28%, #FFFBF2, #FDEBCF); border:1.5px dashed var(--line-2);
  transition: transform .25s var(--ease-spring), filter .2s;
}
.r-card.available .r-emoji { transform: scale(1.04); }
h3.r-name { font-size:var(--t-sm); font-weight:800; line-height:1.4; min-height:2.8em; display:flex; align-items:center; justify-content:center; }
.r-cost { display:inline-flex; align-items:center; gap:3px; font-size:var(--t-xs); font-weight:800; color:var(--gold-deep);
  background:var(--gold-soft); border-radius:var(--r-full); padding:2px 10px; margin:6px 0 10px; }
.r-bar { height:9px; border-radius:var(--r-full); background:var(--paper-2); border:1px solid var(--line); overflow:hidden; }
.r-bar i { display:block; height:100%; border-radius:var(--r-full); background:linear-gradient(90deg,#F5C46E,var(--orange)); transition: width .6s var(--ease-out); }
.r-state { margin-top:9px; font-size:var(--t-xs); font-weight:800; color:var(--orange-deep); }
.r-state.lock { color:var(--ink-3); display:inline-flex; align-items:center; gap:3px; }

/* ---------- 记录时间轴 ---------- */
.timeline { list-style:none; margin:0; padding:0; position:relative; }
.timeline::before { content:''; position:absolute; left:22px; top:8px; bottom:8px; width:2px; background:repeating-linear-gradient(180deg, var(--line-2) 0 6px, transparent 6px 12px); }
.tl-item { display:flex; gap:12px; padding:7px 0; animation: viewIn .3s var(--ease-out) both; }
.tl-item:nth-child(2n){animation-delay:.04s} .tl-item:nth-child(3n){animation-delay:.08s}
.tl-icon {
  width:44px; height:44px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:19px;
  background:var(--surface); border:1.5px solid var(--line); box-shadow: var(--shadow-s); position:relative; z-index:1;
}
.tl-body { flex:1; min-width:0; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r-m); padding:10px 13px; box-shadow:var(--shadow-s); }
.tl-title { font-size:var(--t-sm); font-weight:700; line-height:1.5; }
.tl-sub { font-size:var(--t-xs); color:var(--ink-3); margin-top:2px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; line-height:1.5; }
.tl-pts { font-size:var(--t-md); font-weight:800; align-self:center; }
.tl-pts.up { color:var(--green-deep); } .tl-pts.down { color:var(--berry-deep); }
.chip { font-size:11px; font-weight:800; padding:1px 8px; border-radius:var(--r-full); }
.chip.pending { background:var(--orange-soft); color:var(--orange-deep); }
.chip.done { background:var(--green-soft); color:var(--green-deep); }

/* ---------- 通用组件 ---------- */
.btn {
  border:none; border-radius:var(--r-full); padding:12px 24px; font-size:var(--t-md); font-weight:800; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:7px; transition: transform .15s var(--ease-out), box-shadow .15s, opacity .15s;
}
.btn-primary { background:linear-gradient(160deg,#F9A45E,var(--orange)); color:#fff; box-shadow:0 5px 0 var(--orange-deep), var(--shadow-s); }
.btn-primary:hover { transform: translateY(-1px); box-shadow:0 6px 0 var(--orange-deep), var(--shadow-m); }
.btn-soft { background:var(--surface); border:1.5px solid var(--line-2); color:var(--ink); box-shadow:var(--shadow-s); }
.btn-soft:hover { background:var(--surface-2); }
.btn-danger { background:var(--danger-soft); border:1.5px solid #F2CFCB; color:var(--danger); }
.btn-primary:active, .btn-soft:active, .btn-danger:active { transform: translateY(2px); box-shadow:none; }
.btn.full { width:100%; margin-top:var(--s3); }
.btn[disabled], .btn.is-loading { opacity:.55; cursor:not-allowed; pointer-events:none; }
.btn.is-loading { position:relative; color:transparent !important; }
.btn.is-loading::after {
  content:''; position:absolute; width:17px; height:17px; border:2.5px solid rgba(255,255,255,.45); border-top-color:#fff;
  border-radius:50%; animation: spin .7s linear infinite;
}
.btn-soft.is-loading::after, .btn-danger.is-loading::after { border-color:rgba(120,95,60,.28); border-top-color:var(--ink-2); }
@keyframes spin { to { transform: rotate(360deg); } }
/* 幽灵小操作（每屏只留 1 个 primary，其余降级） */
.mini {
  border:1.5px solid transparent; border-radius:10px; padding:5px 10px; font-size:var(--t-xs); font-weight:700;
  background:transparent; color:var(--ink-2); cursor:pointer; display:inline-flex; align-items:center; gap:3px; transition: background .15s, color .15s;
}
.mini:hover { background:var(--paper-2); color:var(--ink); }
.mini.brand { color:var(--orange-deep); } .mini.brand:hover { background:var(--orange-soft); }
.mini.danger { color:var(--danger); } .mini.danger:hover { background:var(--danger-soft); }
.mini[disabled] { opacity:.4; cursor:not-allowed; }

/* 骨架屏 */
.skeleton { background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r-m); padding:14px; margin-bottom:10px; overflow:hidden; position:relative; }
.sk-line { height:12px; border-radius:6px; background:var(--paper-2); width:42%; margin-bottom:8px; }
.sk-line.w60 { width:60%; } .sk-line.w25 { width:25%; margin-bottom:0; height:10px; }
.skeleton::after {
  content:''; position:absolute; inset:0; transform:translateX(-100%);
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent); animation: shimmer 1.4s infinite;
}
@keyframes shimmer { to { transform: translateX(100%); } }

/* 空状态 */
.empty { text-align:center; padding: var(--s12) var(--s6); }
.empty-art {
  width:86px; height:86px; margin:0 auto var(--s4); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:38px;
  background:var(--surface); border:1.5px dashed var(--line-2); box-shadow: var(--shadow-s); animation: bob 3s ease-in-out infinite;
}
.empty-title { font-size:var(--t-md); font-weight:800; }
.empty-sub { font-size:var(--t-sm); color:var(--ink-2); margin-top:4px; line-height:1.6; }
@keyframes bob { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-7px) } }

/* ---------- 覆层 ---------- */
.overlay { position:fixed; inset:0; background:rgba(66,46,20,.42); backdrop-filter:blur(3px); display:flex; align-items:center;
  justify-content:center; z-index:100; padding:22px; animation: fadeOut .18s; opacity:1; }
.overlay.closing { animation:none; opacity:0; transition: opacity .18s; }
.sheet {
  background:var(--surface); border-radius:var(--r-l); padding:var(--s6) var(--s5) var(--s5); width:100%; max-width:400px;
  max-height:84vh; overflow:auto; box-shadow:var(--shadow-l); position:relative; animation: pop .26s var(--ease-spring);
}
.overlay.closing .sheet { animation:none; opacity:0; transform:scale(.94); transition:all .18s; }
.sheet-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--s2); }
.sheet h3 { font-size:var(--t-lg); font-weight:800; }
.x-close { position:absolute; top:14px; right:14px; width:30px;height:30px;border-radius:50%;border:none;background:var(--paper-2);color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center; z-index:2; }
.x-close:hover { background:var(--line); }
.mtxt { font-size:var(--t-md); color:var(--ink-2); line-height:1.7; margin:6px 0; }
.mrow { display:flex; gap:10px; justify-content:flex-end; margin-top:var(--s5); }
.hint { font-size:var(--t-sm); color:var(--ink-2); background:var(--gold-soft); border:1px dashed #EFD9A8; border-radius:var(--r-s); padding:9px 12px; margin-top:var(--s4); line-height:1.6; display:flex; gap:7px; align-items:flex-start; }
/* 表单 */
.lb { display:block; font-size:var(--t-sm); color:var(--ink-2); font-weight:800; margin:var(--s4) 0 6px; }
.field { width:100%; border:1.5px solid var(--line-2); border-radius:var(--r-s); padding:11px 13px; font-size:var(--t-md);
  background:var(--surface); outline:none; color:var(--ink); font-family:inherit; transition:border-color .15s, box-shadow .15s; }
.field:focus { border-color:var(--orange); box-shadow:0 0 0 3px rgba(240,138,60,.16); }
.field.invalid { border-color:var(--danger); box-shadow:0 0 0 3px rgba(217,83,79,.12); }
.field-error { display:none; font-size:var(--t-xs); color:var(--danger); font-weight:700; margin-top:5px; line-height:1.5; }
.field-error.show { display:flex; align-items:center; gap:4px; animation: viewIn .2s; }
/* 表情盘 */
.emgrid { display:grid; grid-template-columns:repeat(6,1fr); gap:7px; }
.em { font-size:21px; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r-s); padding:6px 0; cursor:pointer; transition:all .15s; }
.em:hover { border-color:var(--line-2); transform:translateY(-1px); }
.em.on { border-color:var(--orange); background:var(--orange-soft); box-shadow:0 0 0 2px rgba(240,138,60,.18); }
.cat-row { display:flex; gap:8px; }
.cat { flex:1; border:1.5px solid var(--line-2); background:var(--surface); border-radius:var(--r-s); padding:10px 0; font-size:var(--t-sm); font-weight:800; color:var(--ink-2); cursor:pointer; display:flex;align-items:center;justify-content:center;gap:5px; transition:all .15s; }
.cat.on { border-color:var(--blue); color:var(--blue-deep); background:var(--blue-soft); }
.cat[data-cat="behavior"].on { border-color:var(--green); color:var(--green-deep); background:var(--green-soft); }
/* PIN 键盘 */
.pin-dots { display:flex; gap:12px; justify-content:center; margin:var(--s5) 0 var(--s2); }
.pin-dots.shake { animation: shake .4s; }
.pin-dot { width:13px; height:13px; border-radius:50%; background:var(--paper-2); border:1.5px solid var(--line-2); transition:all .18s var(--ease-spring); }
.pin-dot.f { background:var(--orange); border-color:var(--orange-deep); transform:scale(1.18); }
.pin-err { text-align:center; font-size:var(--t-sm); color:var(--danger); min-height:22px; font-weight:700; }
.keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:var(--s3); }
.key { background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r-m); font-size:21px; font-weight:800; padding:13px 0; cursor:pointer; color:var(--ink); box-shadow:var(--shadow-s); transition:all .12s; }
.key:hover { background:var(--surface-2); }
.key:active { transform:scale(.94); background:var(--orange-soft); }
/* Toast */
.toast { position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(14px);
  background:#4A3721; color:#FFF6EA; font-size:var(--t-sm); font-weight:700; padding:11px 20px; border-radius:var(--r-full);
  opacity:0; pointer-events:none; transition:all .28s var(--ease-out); z-index:120; max-width:88vw; text-align:center; box-shadow:var(--shadow-l); }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
/* 庆祝 */
.float-pts { position:fixed; left:50%; top:26%; font-size:var(--t-2xl); font-weight:900; color:var(--gold-deep);
  text-shadow:0 2px 0 #fff, 0 6px 18px rgba(233,162,59,.45); z-index:115; pointer-events:none; animation: floatUp 1.25s var(--ease-out) forwards; }
@keyframes floatUp { 0%{opacity:0; transform:translate(-50%,16px) scale(.5)} 22%{opacity:1} 100%{opacity:0; transform:translate(-50%,-78px) scale(1.25)} }
.cfz { position:fixed; top:-26px; z-index:118; pointer-events:none; animation: cfzFall 1.35s ease-in forwards; }
@keyframes cfzFall { to { transform:translateY(108vh) rotate(270deg); opacity:.85 } }
/* 关键帧 */
@keyframes stampIn { from { transform:scale(1.7) rotate(-16deg); opacity:0 } to { transform:scale(1) rotate(0); opacity:1 } }
@keyframes stickerIn { from { opacity:0; transform:translateY(10px) scale(.97) } to { opacity:1; transform:none } }
@keyframes viewIn { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
@keyframes pop { from { transform:scale(.92) translateY(12px); opacity:0 } }
@keyframes fadeOut { from { opacity:0 } }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-9px)} 75%{transform:translateX(9px)} }
@keyframes coinBreathe { 0%,100%{transform:scale(1) rotate(0)} 50%{transform:scale(1.06) rotate(-6deg)} }

'use strict';

/* ============================================================ 工具层 ============================================================ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function pad2(n) { return String(n).padStart(2, '0'); }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function addDays(dateStr, delta) {
  var p = dateStr.split('-').map(Number);
  var t = new Date(p[0], p[1] - 1, p[2]);
  t.setDate(t.getDate() + delta);
  return t.getFullYear() + '-' + pad2(t.getMonth() + 1) + '-' + pad2(t.getDate());
}
function fmtMD(s) { var p = s.split('-').map(Number); return p[1] + '月' + p[2] + '日'; }
function weekdayOf(s) { var p = s.split('-').map(Number); return '日一二三四五六'[new Date(p[0], p[1] - 1, p[2]).getDay()]; }
function fmtTs(ts) {
  var d = new Date(ts); if (isNaN(d.getTime())) return '';
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);

}

/* 头像/图片统一渲染：'svg:key' → 内置图标；'data:image/...' → 上传图；否则 emoji */
function mediaHtml(av, emoji, cls) {
  if (av && av.indexOf('svg:') === 0 && SVG_AVATARS[av.slice(4)]) {
    return '<span class="' + cls + ' has-svg" aria-hidden="true">' + SVG_AVATARS[av.slice(4)] + '</span>';
  }
  if (av && av.indexOf('data:image/') === 0) {
    return '<span class="' + cls + ' has-img" aria-hidden="true"><img src="' + av + '" alt=""></span>';
  }
  return '<span class="' + cls + '" aria-hidden="true">' + (emoji || '🙂') + '</span>';
}
/* 照片压缩：居中裁方 → 256px JPEG，控制体积 */
function compressImage(file, cb) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      try {
        var size = 256, side = Math.min(img.width, img.height);
        var c = document.createElement('canvas'); c.width = size; c.height = size;
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
        var q = 0.82, url = c.toDataURL('image/jpeg', q);
        while (url.length > 280000 && q > 0.4) { q -= 0.15; url = c.toDataURL('image/jpeg', q); }
        cb(url);
      } catch (e) { toast('图片处理失败，换一张试试'); }
    };
    img.onerror = function () { toast('图片读取失败'); };
    img.src = reader.result;
  };
  reader.onerror = function () { toast('图片读取失败'); };
  reader.readAsDataURL(file);
}

/* ---- API ---- */
function api(path, body, token) {
  var opt = { method: body === undefined ? 'GET' : 'POST', headers: {} };
  if (token) opt.headers['Authorization'] = 'Bearer ' + token;
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  return fetch(path, opt).then(function (res) {
    return res.json().catch(function () { return null; }).then(function (d) {
      if (!res.ok) throw new Error((d && d.error) || ('请求失败 ' + res.status));
      return d;
    });
  });
}

/* ---- 反馈组件 ---- */
var toastTimer = null;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400);
}
function openModal(html, opts) {
  if (confirmResolve) { var r = confirmResolve; confirmResolve = null; r(false); }
  var o = opts || {};
  var dismiss = o.dismissable === false ? '' : ' onclick="overlayTap(event)"';
  document.getElementById('modalRoot').innerHTML =
    '<div class="overlay"' + dismiss + ' role="dialog" aria-modal="true" aria-label="' + esc(o.label || '弹窗') + '">' +
    '<div class="sheet" onclick="event.stopPropagation()">' +
    (o.noClose ? '' : '<button class="x-close" aria-label="关闭" onclick="closeModal()">' + ICONS.x + '</button>') +
    html + '</div></div>';
}
function closeModal() {
  var ov = document.querySelector('#modalRoot .overlay');
  if (!ov) { document.getElementById('modalRoot').innerHTML = ''; return; }
  ov.classList.add('closing');
  setTimeout(function () { document.getElementById('modalRoot').innerHTML = ''; }, 190);
}
function overlayTap() { if (confirmResolve) { resolveConfirm(false); return; } closeModal(); }
function askConfirm(o) {
  return new Promise(function (resolve) {
    confirmResolve = resolve;
    openModal('<div class="sheet-head"><h3>' + esc(o.title) + '</h3></div><div class="mtxt">' + o.html + '</div>' +
      '<div class="mrow"><button class="btn btn-soft" onclick="resolveConfirm(false)">再想想</button>' +
      '<button class="btn ' + (o.danger ? 'btn-danger' : 'btn-primary') + '" onclick="resolveConfirm(true)">' + esc(o.okText || '确定') + '</button></div>',
      { noClose: true, dismissable: false, label: o.title });
  });
}
function resolveConfirm(v) { closeModal(); var r = confirmResolve; confirmResolve = null; if (r) r(v); }

/* P1-1：按钮 loading + 防重复提交 */
function setLoading(btn, on) {
  if (!btn) return;
  if (on) { btn.classList.add('is-loading'); btn.setAttribute('disabled', 'disabled'); btn.setAttribute('aria-busy', 'true'); }
  else { btn.classList.remove('is-loading'); btn.removeAttribute('disabled'); btn.removeAttribute('aria-busy'); }
}
function btnOf(el) {
  if (!el) return null;
  if (el.classList && el.classList.contains('btn')) return el;
  return el.closest ? el.closest('.btn') : null;
}
function floatPts(txt) {
  var el = document.createElement('div'); el.className = 'float-pts'; el.textContent = txt;
  document.body.appendChild(el); setTimeout(function () { el.remove(); }, 1300);
}
function confetti() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var set = ['⭐', '🎉', '✨', '🎈', '💛', '🌟'];
  for (var i = 0; i < 12; i++) {
    (function () {
      var el = document.createElement('div'); el.className = 'cfz';
      el.textContent = set[Math.floor(Math.random() * set.length)];
      el.style.left = (8 + Math.random() * 84) + '%';
      el.style.fontSize = (15 + Math.random() * 13) + 'px';
      el.style.animationDelay = (Math.random() * .3) + 's';
      document.body.appendChild(el); setTimeout(function () { el.remove(); }, 1750);
    })();
  }
}
/* P1-2：内联字段报错 */
function fieldError(inputId, msg) {
  var input = document.getElementById(inputId);
  if (!input) return false;
  var box = input.parentElement.querySelector('.field-error[data-for="' + inputId + '"]');
  if (!box) { box = document.createElement('div'); box.className = 'field-error'; box.setAttribute('data-for', inputId); input.insertAdjacentElement('afterend', box); }
  if (msg) {
    box.innerHTML = ICONS.warn + '<span>' + esc(msg) + '</span>';
    box.classList.add('show'); input.classList.add('invalid'); input.setAttribute('aria-invalid', 'true');
    return false;
  }
  box.classList.remove('show'); input.classList.remove('invalid'); input.removeAttribute('aria-invalid');
  return true;
}

/* ============================================================ 数据加载 ============================================================ */
async function loadKids() {
  try { var r = await api('/api/kids'); S.kids = r.kids || []; }
  catch (e) { toast('加载失败：' + e.message); S.kids = []; }
  var saved = Number(store('kp_kid'));
  if (S.kids.length) {
    S.kidId = S.kids.some(function (k) { return k.id === saved; }) ? saved : S.kids[0].id;
    await loadState();
  } else { S.kidId = null; S.st = null; renderAll(); }
}
async function loadState() {
  if (!S.kidId) { renderAll(); return; }
  try {
    var r = await api('/api/state?kid=' + S.kidId + '&date=' + S.date + '&from=' + addDays(S.date, -6));
    if (r.noKids) { S.kids = []; S.kidId = null; S.st = null; renderAll(); return; }
    S.st = r;
    var k = S.kids.find(function (x) { return x.id === S.kidId; });
    if (k && r.kid) { k.name = r.kid.name; k.emoji = r.kid.emoji; }
    renderAll();
  } catch (e) { toast('加载失败：' + e.message); }
}

/* ---- 打卡（贴纸 + 橡皮章） ---- */
function renderCheckin() {
  var st = S.st;
  var groups = [['learning', '学习打卡', 'book', ''], ['behavior', '行为习惯', 'sprout', 'green']];
  var html = '';
  groups.forEach(function (g) {
    var hs = st.habits.filter(function (h) { return h.category === g[0]; });
    if (!hs.length) return;
    var done = hs.filter(function (h) { return st.todayCheckins.some(function (c) { return c.habit_id === h.id; }); }).length;
    html += '<section class="view">' +
      '<div class="g-head"><span class="g-badge ' + g[3] + '">' + ICONS[g[2]] + '</span><h2 class="g-title">' + g[1] + '</h2>' +
      '<span class="g-count">' + ringPct(hs.length ? done / hs.length : 0) + '<span class="num">' + done + '/' + hs.length + '</span></span></div>';
    html += hs.map(function (h) {
      var c = st.todayCheckins.find(function (x) { return x.habit_id === h.id; });
      return '<button class="habit ' + g[3] + ' ' + (c ? 'done' : '') + '" onclick="tapHabit(' + h.id + ', this)" aria-pressed="' + !!c + '" aria-label="' + esc(h.name) + '，' + (c ? '已打卡' : '未打卡') + '，' + h.points + ' 分">' +
        '<span class="h-emoji" aria-hidden="true">' + h.emoji + '</span>' +
        '<span class="h-main"><span class="h-name">' + esc(h.name) + '</span><br>' +
        '<span class="h-meta">' + ICONS.coinSm + ' ' + (c ? '已得 ' : '+') + h.points + ' 分' + (c ? ' ✓' : '') + '</span></span>' +
        '<span class="stamp" aria-hidden="true">' + (c ? ICONS.check : ICONS.check) + '</span></button>';
    }).join('');
    html += '</section>';
  });
  if (!st.habits.length) {
    html = empty('🌱', '还没有打卡项目', '爸爸妈妈可以在家长管理里添加学习和行为习惯', '<button class="btn btn-primary" style="margin-top:20px" onclick="parentEntry()">去添加</button>');
  } else {
    var allDone = st.habits.length > 0 && st.habits.every(function (h) { return st.todayCheckins.some(function (c) { return c.habit_id === h.id; }); });
    if (allDone) html += '<div class="hint" style="margin-top:20px">' + ICONS.bulb + '<span>今天全部完成！攒到的积分可以去「礼物」换成心动好礼 🎁</span></div>';
  }
  document.getElementById('main').innerHTML = html;
}
async function tapHabit(habitId, el) {
  if (!S.st || S.busy) return;
  var habit = S.st.habits.find(function (h) { return h.id === habitId; });
  if (!habit) return;
  var done = S.st.todayCheckins.find(function (c) { return c.habit_id === habitId; });
  if (done) {
    var ok = await askConfirm({ title: '取消打卡', html: '要取消「' + esc(habit.name) + '」今天的打卡吗？会扣回 <b class="num">' + done.points + '</b> 分哦', okText: '取消打卡', danger: true });
    if (!ok) return;
    S.busy = true;
    try {
      var r = await api('/api/uncheck', { kidId: S.kidId, habitId: habitId, date: S.date });
      applyPts(r);
      toast('已取消打卡');
      await loadState();
    } catch (e) { toast(e.message); }
    S.busy = false;
    return;
  }
  S.busy = true;
  var btn = btnOf(el);
  setLoading(btn, true);
  try {
    var r2 = await api('/api/checkin', { kidId: S.kidId, habitId: habitId, date: S.date });
    if (r2.already) { toast('今天已经打过卡啦'); }
    else {
      applyPts(r2);
      S.st.todayCheckins.push({ habit_id: habitId, points: habit.points });
      renderCheckin(); renderWallet();
      floatPts('+' + habit.points);
      confetti();
      toast('打卡成功，太棒了！');
    }
    loadState();
  } catch (e) { toast(e.message); setLoading(btn, false); }
  S.busy = false;
}
function applyPts(r) {
  if (!r) return;
  if (typeof r.balance === 'number') S.st.balance = r.balance;
  if (typeof r.earned === 'number') S.st.earned = r.earned;
  if (typeof r.spent === 'number') S.st.spent = r.spent;
}

async function redeemDo(rid) {

/* ============================================================ 家长：密码门 ============================================================ */
async function parentEntry() {
  if (S.ptoken) {
    try { await api('/api/parent/verify', { token: S.ptoken }); openParent(); }
    catch (e) { S.ptoken = ''; store('kp_ptoken', null); openPin(); }
  } else openPin();
}
function openPin() {
  pinBuf = '';
  var keys = '';
  [1,2,3,4,5,6,7,8,9].forEach(function (n) { keys += '<button class="key" aria-label="数字 ' + n + '" onclick="pinKey(\'' + n + '\')">' + n + '</button>'; });
  openModal('<div class="sheet-head"><h3>家长验证</h3></div>' +
    '<p class="mtxt" style="text-align:center">输入家长密码，管理打卡项目和礼物</p>' +
    '<div class="pin-dots" id="pinDots" role="status" aria-label="已输入位数"></div><div class="pin-err" id="pinErr" role="alert"></div>' +
    '<div class="keypad">' + keys +
    '<button class="key" aria-label="清空" onclick="pinKey(\'clear\')">清空</button>' +
    '<button class="key" aria-label="数字 0" onclick="pinKey(\'0\')">0</button>' +
    '<button class="key" aria-label="删除一位" onclick="pinKey(\'del\')">⌫</button></div>' +
    '<div class="mrow" style="justify-content:center"><button class="btn btn-soft" onclick="closeModal()">取消</button>' +
    '<button class="btn btn-primary" id="pinOk" onclick="pinSubmit()">进入管理</button></div>' +
    '<div class="hint">' + ICONS.bulb + '<span>首次使用的默认密码是 <b>1234</b>，登录后可以在「设置」里修改</span></div>',
    { noClose: true, label: '家长密码' });
  renderPinDots();
}
function renderPinDots() {
  var el = document.getElementById('pinDots'); if (!el) return;
  var n = Math.max(4, pinBuf.length), h = '';
  for (var i = 0; i < n; i++) h += '<span class="pin-dot ' + (i < pinBuf.length ? 'f' : '') + '"></span>';
  el.innerHTML = h;
  el.setAttribute('aria-label', '已输入 ' + pinBuf.length + ' 位');
}
function pinKey(k) {
  if (k === 'del') pinBuf = pinBuf.slice(0, -1);
  else if (k === 'clear') pinBuf = '';
  else if (pinBuf.length < 12) pinBuf += k;
  renderPinDots();
}
function pinShake(msg) {
  var el = document.getElementById('pinErr'); if (el) el.textContent = msg;
  pinBuf = ''; renderPinDots();
  var dots = document.querySelector('.pin-dots');
  if (dots) { dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); }
}
async function pinSubmit() {
  var btn = document.getElementById('pinOk');
  if (pinBuf.length < 4) { pinShake('密码至少 4 位'); return; }
  setLoading(btn, true);
  try {
    var r = await api('/api/parent/login', { pin: pinBuf });
    S.ptoken = r.token; store('kp_ptoken', r.token);
    closeModal(); setTimeout(openParent, 200);
  } catch (e) { pinShake(e.message); setLoading(btn, false); }
}

function setRwdSrc(t) {
  rwdKind = t;
  document.querySelectorAll('#modalRoot .src-tab').forEach(function (b) {
    var on = b.getAttribute('data-src') === t;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', String(on));
  });
  ['emoji', 'photo'].forEach(function (k) {
    var p = document.getElementById('rwdPane-' + k);
    if (p) p.classList.toggle('hide', k !== t);
  });
}
function pickIcon(btn) {
  pickAvatar = btn.getAttribute('data-k');
  btn.parentElement.querySelectorAll('.icon-pick').forEach(function (b) {
    b.classList.remove('on'); b.setAttribute('aria-pressed', 'false');
  });
  btn.classList.add('on'); btn.setAttribute('aria-pressed', 'true');
}
function onAvaFile(input) {
  var f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  if (!/^image\//.test(f.type)) { toast('请选择图片文件'); return; }
  compressImage(f, function (url) {
    pickAvatar = url;
    setPreview('avaPreview', url);
    setAvaSrc('photo');
  });
}
function onRwdFile(input) {
  var f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  if (!/^image\//.test(f.type)) { toast('请选择图片文件'); return; }
  compressImage(f, function (url) {
    pickRewardImg = url;
    setPreview('rwdPreview', url);
    setRwdSrc('photo');
  });
}
function openKidForm(id) {
  var k = id ? S.pdata.kids.find(function (x) { return x.id === id; }) : null;
  pickEmoji = k ? k.emoji : '👦';
  avaKind = 'emoji'; pickAvatar = null;
  if (k && k.avatar_url) {
    if (k.avatar_url.indexOf('svg:') === 0 && SVG_AVATARS[k.avatar_url.slice(4)]) { avaKind = 'icon'; pickAvatar = k.avatar_url; }
    else if (k.avatar_url.indexOf('data:image/') === 0) { avaKind = 'photo'; pickAvatar = k.avatar_url; }
  }
  openModal('<div class="sheet-head"><h3>' + (k ? '编辑孩子' : '添加孩子') + '</h3></div>' +
    '<label class="lb" for="fKidName">名字</label><input class="field" id="fKidName" maxlength="12" value="' + (k ? esc(k.name) : '') + '" placeholder="比如：小雨">' +
    '<label class="lb">头像</label>' +
    '<div class="src-tabs" role="tablist" aria-label="头像来源">' +
    '<button type="button" class="src-tab" data-src="icon" role="tab" onclick="setAvaSrc(\'icon\')">图标库</button>' +
    '<button type="button" class="src-tab" data-src="emoji" role="tab" onclick="setAvaSrc(\'emoji\')">表情</button>' +
    '<button type="button" class="src-tab" data-src="photo" role="tab" onclick="setAvaSrc(\'photo\')">照片</button></div>' +
    '<div class="src-pane" id="avaPane-icon">' + iconGridHtml() + '</div>' +
    '<div class="src-pane" id="avaPane-emoji">' + emojiGrid(KID_EMOJIS, pickEmoji) + '</div>' +
    '<div class="src-pane" id="avaPane-photo">' + photoPaneHtml('avaPreview', 'avaCam', 'avaFile', 'onAvaFile') + '</div>' +
    '<div class="mrow"><button class="btn btn-soft" onclick="closeModal()">取消</button>' +
    '<button class="btn btn-primary" id="kidBtn" onclick="saveKid(' + (id || 0) + ')">保存</button></div>', { noClose: true, dismissable: false, label: '孩子信息' });
  setAvaSrc(avaKind);
  setPreview('avaPreview', avaKind === 'photo' ? pickAvatar : '');
}
async function saveKid(id) {
  var nameEl = document.getElementById('fKidName');
  var name = nameEl.value.trim();
  fieldError('fKidName', name ? null : '先给孩子起个名字吧');
  if (!name) { nameEl.focus(); return; }
  var avatarUrl = (avaKind === 'icon' || avaKind === 'photo') ? pickAvatar : null;
  var btn = document.getElementById('kidBtn'); setLoading(btn, true);
  var body = id ? { action: 'update', id: id, name: name, emoji: pickEmoji, avatarUrl: avatarUrl } : { action: 'create', name: name, emoji: pickEmoji, avatarUrl: avatarUrl };
  try {
    await api('/api/parent/kids', body, S.ptoken);
    closeModal(); toast('已保存');
    await loadParent();
    await loadKids();
  } catch (e) { toast(e.message); setLoading(btn, false); }
}
async function delKid(id) {
  var k = S.pdata.kids.find(function (x) { return x.id === id; });
  if (!k) return;
  var ok = await askConfirm({ title: '删除孩子', html: '确定删除「' + esc(k.name) + '」吗？<br>TA 的打卡、积分、兑换记录会<b>全部删除且无法恢复</b>', okText: '删除', danger: true });
  if (!ok) return;
  try {
    await api('/api/parent/kids', { action: 'delete', id: id }, S.ptoken);
    toast('已删除'); await loadParent(); await loadKids();
  } catch (e) { toast(e.message); }
}
function openHabitForm(id) {
  var h = id ? S.pdata.habits.find(function (x) { return x.id === id; }) : null;
  pickEmoji = h ? h.emoji : '⭐'; catSel = h ? h.category : 'learning';
  openModal('<div class="sheet-head"><h3>' + (h ? '编辑打卡项目' : '添加打卡项目') + '</h3></div>' +
    '<label class="lb" for="fHabitName">名称</label><input class="field" id="fHabitName" maxlength="20" value="' + (h ? esc(h.name) : '') + '" placeholder="比如：练习跳绳">' +
    '<label class="lb">图标</label>' + emojiGrid(HABIT_EMOJIS, pickEmoji) +
    '<label class="lb">分类</label><div class="cat-row">' +
    '<button type="button" data-cat="learning" class="cat ' + (catSel === 'learning' ? 'on' : '') + '" aria-pressed="' + (catSel === 'learning') + '" onclick="setCat(\'learning\')">' + ICONS.book + ' 学习</button>' +
    '<button type="button" data-cat="behavior" class="cat ' + (catSel === 'behavior' ? 'on' : '') + '" aria-pressed="' + (catSel === 'behavior') + '" onclick="setCat(\'behavior\')">' + ICONS.sprout + ' 行为</button></div>' +
    '<label class="lb" for="fHabitPts">每次积分</label><input class="field num" id="fHabitPts" type="number" min="1" max="999" value="' + (h ? h.points : 1) + '">' +
    '<div class="mrow"><button class="btn btn-soft" onclick="closeModal()">取消</button>' +
    '<button class="btn btn-primary" id="habitBtn" onclick="saveHabit(' + (id || 0) + ')">保存</button></div>', { noClose: true, dismissable: false, label: '打卡项目' });
}
async function saveHabit(id) {
  var nameEl = document.getElementById('fHabitName'), ptsEl = document.getElementById('fHabitPts');
  var name = nameEl.value.trim(), pts = Number(ptsEl.value), bad = null;
  if (!name) bad = '请填写名称';
  else if (!Number.isInteger(pts) || pts < 1 || pts > 999) bad = '积分要在 1-999 之间';
  fieldError('fHabitName', name ? null : '请填写名称');
  fieldError('fHabitPts', (bad && bad.indexOf('积分') === 0) ? bad : null);
  if (bad) { (name ? ptsEl : nameEl).focus(); return; }
  var btn = document.getElementById('habitBtn'); setLoading(btn, true);
  var body = id ? { action: 'update', id: id, name: name, emoji: pickEmoji, category: catSel, points: pts }
                : { action: 'create', name: name, emoji: pickEmoji, category: catSel, points: pts };
  try {
    await api('/api/parent/habits', body, S.ptoken);
    closeModal(); toast('已保存');
    await loadParent(); if (S.kidId) await loadState();
  } catch (e) { toast(e.message); setLoading(btn, false); }
}
async function toggleHabit(id, active) {
  try {
    await api('/api/parent/habits', { action: 'update', id: id, active: !active }, S.ptoken);
    toast(active ? '已下架' : '已上架');
    loadParent(); if (S.kidId) loadState();
  } catch (e) { toast(e.message); }
}
async function delHabit(id) {
  var h = S.pdata.habits.find(function (x) { return x.id === id; });
  if (!h) return;
  var ok = await askConfirm({ title: '删除打卡项目', html: '删除「' + esc(h.name) + '」后，它的<b>历史打卡记录和积分也会一起删除</b>。<br>如果只是暂时不用，建议选择「下架」。', okText: '仍要删除', danger: true });
  if (!ok) return;
  try {
    await api('/api/parent/habits', { action: 'delete', id: id }, S.ptoken);
    toast('已删除'); await loadParent(); if (S.kidId) loadState();
  } catch (e) { toast(e.message); }
}
function openRewardForm(id) {
  var r = id ? S.pdata.rewards.find(function (x) { return x.id === id; }) : null;
  pickEmoji = r ? r.emoji : '🎁';
  rwdKind = 'emoji'; pickRewardImg = null;
  if (r && r.image_url && r.image_url.indexOf('data:image/') === 0) { rwdKind = 'photo'; pickRewardImg = r.image_url; }
  openModal('<div class="sheet-head"><h3>' + (r ? '编辑礼物' : '添加礼物') + '</h3></div>' +
    '<label class="lb" for="fRewardName">名称</label><input class="field" id="fRewardName" maxlength="30" value="' + (r ? esc(r.name) : '') + '" placeholder="比如：去游乐园玩一次">' +
    '<label class="lb">图片</label>' +
    '<div class="src-tabs" role="tablist" aria-label="图片来源">' +
    '<button type="button" class="src-tab" data-src="emoji" role="tab" onclick="setRwdSrc(\'emoji\')">表情</button>' +
    '<button type="button" class="src-tab" data-src="photo" role="tab" onclick="setRwdSrc(\'photo\')">照片</button></div>' +
    '<div class="src-pane" id="rwdPane-emoji">' + emojiGrid(REWARD_EMOJIS, pickEmoji) + '</div>' +
    '<div class="src-pane" id="rwdPane-photo">' + photoPaneHtml('rwdPreview', 'rwdCam', 'rwdFile', 'onRwdFile') + '</div>' +
    '<label class="lb" for="fRewardCost">需要积分</label><input class="field num" id="fRewardCost" type="number" min="1" max="9999" value="' + (r ? r.cost : 20) + '">' +
    '<div class="mrow"><button class="btn btn-soft" onclick="closeModal()">取消</button>' +
    '<button class="btn btn-primary" id="rewardBtn" onclick="saveReward(' + (id || 0) + ')">保存</button></div>', { noClose: true, dismissable: false, label: '礼物信息' });
  setRwdSrc(rwdKind);
  setPreview('rwdPreview', rwdKind === 'photo' ? pickRewardImg : '');
}
async function saveReward(id) {
  var nameEl = document.getElementById('fRewardName'), costEl = document.getElementById('fRewardCost');
  var name = nameEl.value.trim(), cost = Number(costEl.value), bad = null;
  if (!name) bad = '请填写礼物名称';
  else if (!Number.isInteger(cost) || cost < 1 || cost > 9999) bad = '所需积分要在 1-9999 之间';
  fieldError('fRewardName', name ? null : '请填写礼物名称');
  fieldError('fRewardCost', (bad && bad.indexOf('积分') === 0) ? bad : null);
  if (bad) { (name ? costEl : nameEl).focus(); return; }
  var imageUrl = (rwdKind === 'photo') ? pickRewardImg : null;
  var btn = document.getElementById('rewardBtn'); setLoading(btn, true);
  var body = id ? { action: 'update', id: id, name: name, emoji: pickEmoji, cost: cost, imageUrl: imageUrl }
                : { action: 'create', name: name, emoji: pickEmoji, cost: cost, imageUrl: imageUrl };
  try {
    await api('/api/parent/rewards', body, S.ptoken);
    closeModal(); toast('已保存');
    await loadParent(); if (S.kidId) await loadState();
  } catch (e) { toast(e.message); setLoading(btn, false); }
}
async function toggleReward(id, active) {
  try {
    await api('/api/parent/rewards', { action: 'update', id: id, active: !active }, S.ptoken);
    toast(active ? '已下架' : '已上架');
    loadParent(); if (S.kidId) loadState();
  } catch (e) { toast(e.message); }
}
async function delReward(id) {
  var r = S.pdata.rewards.find(function (x) { return x.id === id; });
  if (!r) return;
  var ok = await askConfirm({ title: '删除礼物', html: '确定删除「' + esc(r.name) + '」吗？已产生的兑换记录会保留。', okText: '删除', danger: true });
  if (!ok) return;
  try {
    await api('/api/parent/rewards', { action: 'delete', id: id }, S.ptoken);
    toast('已删除'); await loadParent(); if (S.kidId) loadState();
  } catch (e) { toast(e.message); }
}
function openAdjust(kidId, sign) {
  var k = S.pdata.kids.find(function (x) { return x.id === kidId; });
  if (!k) return;
  openModal('<div class="sheet-head"><h3>' + (sign > 0 ? '加分' : '扣分') + ' · ' + esc(k.name) + '</h3></div>' +
    '<label class="lb" for="fAdjPts">分值</label><input class="field num" id="fAdjPts" type="number" min="1" max="999" value="1">' +
    '<label class="lb" for="fAdjNote">原因（可选）</label><input class="field" id="fAdjNote" maxlength="30" placeholder="' + (sign > 0 ? '比如：主动帮做家务' : '比如：发脾气摔东西') + '">' +
    '<div class="mrow"><button class="btn btn-soft" onclick="closeModal()">取消</button>' +
    '<button class="btn btn-primary" id="adjBtn" onclick="saveAdjust(' + kidId + ',' + sign + ')">确定</button></div>', { noClose: true, dismissable: false, label: '积分调整' });
}
async function saveAdjust(kidId, sign) {
  var ptsEl = document.getElementById('fAdjPts');
  var p = Number(ptsEl.value), note = document.getElementById('fAdjNote').value.trim();
  if (!Number.isInteger(p) || p < 1 || p > 999) { fieldError('fAdjPts', '分值要在 1-999 之间'); ptsEl.focus(); return; }
  fieldError('fAdjPts', null);
  var btn = document.getElementById('adjBtn'); setLoading(btn, true);
  try {
    await api('/api/parent/adjust', { kidId: kidId, points: sign * p, note: note, date: S.date }, S.ptoken);
    closeModal(); toast('已调整');
    await loadParent(); if (S.kidId === kidId) loadState();
  } catch (e) { toast(e.message); setLoading(btn, false); }
}
async function markDone(id) {
  try {
    await api('/api/parent/redeem-status', { id: id, status: 'done' }, S.ptoken);
    toast('已兑现 🎉');
    loadParent(); if (S.kidId) loadState();
  } catch (e) { toast(e.message); }
}
async function cancelRedeem(id) {
  var ok = await askConfirm({ title: '取消兑换', html: '取消后这笔积分会<b>退回</b>给孩子，确定吗？', okText: '取消兑换', danger: true });
  if (!ok) return;
  try {
    await api('/api/parent/redeem-status', { id: id, status: 'cancel' }, S.ptoken);
    toast('已取消，积分已退回');
    loadParent(); if (S.kidId) loadState();
  } catch (e) { toast(e.message); }
}
async function savePassword() {
  var o = document.getElementById('fPwdOld'), n1 = document.getElementById('fPwdNew'), n2 = document.getElementById('fPwdNew2');
  fieldError('fPwdOld', null); fieldError('fPwdNew', null); fieldError('fPwdNew2', null);
  if (!o.value || !n1.value) { fieldError(o.value ? 'fPwdNew' : 'fPwdOld', o.value ? '请填写新密码' : '请填写原密码'); return; }
  if (n1.value.length < 4) { fieldError('fPwdNew', '新密码至少 4 位'); return; }
  if (n1.value !== n2.value) { fieldError('fPwdNew2', '两次新密码不一致'); return; }
  var btn = document.getElementById('pwdBtn'); setLoading(btn, true);
  try {
    await api('/api/parent/password', { oldPin: o.value, newPin: n1.value }, S.ptoken);
    toast('密码已修改');
    o.value = ''; n1.value = ''; n2.value = '';
    setLoading(btn, false);
  } catch (e) {
    toast(e.message);
    if (e.message.indexOf('原密码') >= 0) fieldError('fPwdOld', '原密码不对');
    setLoading(btn, false);
  }
}

/* ============================================================ 启动 ============================================================ */
async function boot() {
  await loadKids();
  if (S.ptoken) {
    try { await api('/api/parent/verify', { token: S.ptoken }); }
    catch (e) { S.ptoken = ''; store('kp_ptoken', null); }
  }
}
boot();
</script>
