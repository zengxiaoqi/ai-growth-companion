name: lingxi_companion
description: 灵犀伴学 - AI 儿童成长伙伴
publish_to: 'none'
version: 1.0.0+20260720

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter_skill: ^0.9.36
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  provider: ^6.1.1
  riverpod: ^2.6.1
  
  # 网络
  dio: ^5.3.3
  web: ^1.1.1
  
  # 本地存储
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI 组件
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  image_picker: ^1.0.7
  lottie: ^3.0.0
  fl_chart: ^1.2.0
  
  # 音频
  audioplayers: ^6.7.1

  # 视频播放
  video_player: ^2.9.2

  # 语音识别
  speech_to_text: ^7.3.0

  # 权限处理
  permission_handler: ^12.0.3
  
  # 工具
  uuid: ^4.2.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  
  # 日志
  logging: ^1.2.0
  
  # AI 对话
  dialog_flowtter: ^0.3.3

  vector_math: any

  # Markdown 渲染
  flutter_markdown: ^0.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/audios/
    - assets/animations/
  
# 字体使用系统默认栈：macOS→PingFang SC, Windows→微软雅黑, Android/iOS→系统中文字体

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "app_icon_preview.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"


dependency_overrides:
  http: ^1.1.0


