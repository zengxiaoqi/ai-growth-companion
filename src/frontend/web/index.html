<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="灵犀伴学">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>灵犀伴学</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #lingxi-loader {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: fixed; inset: 0;
      background: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #lingxi-loader.hidden { opacity: 0; pointer-events: none; }
    #lingxi-loader .spinner {
      width: 48px; height: 48px;
      border: 4px solid #e0e0e0; border-top-color: #4a90d9;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #lingxi-loader p { margin-top: 20px; color: #666; font-size: 15px; }
    #lingxi-loader .error { color: #e74c3c; font-size: 14px; margin-top: 8px; max-width: 320px; text-align: center; display: none; }
    #lingxi-loader .error.show { display: block; }
  </style>
</head>
<body>
  <div id="lingxi-loader">
    <div class="spinner"></div>
    <p>灵犀伴学加载中…</p>
    <div class="error" id="lingxi-error"></div>
  </div>

  <script>
    (function() {
      var loader = document.getElementById('lingxi-loader');
      var errorEl = document.getElementById('lingxi-error');
      var timeoutId = null;

      window._lingxiLoader = {
        hide: function() { loader.classList.add('hidden'); },
        error: function(msg) {
          errorEl.textContent = msg;
          errorEl.classList.add('show');
          loader.querySelector('.spinner').style.animation = 'none';
        },
        cancelTimeout: function() { if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; } }
      };

      // 60s 超时检测（慢网环境）
            timeoutId = setTimeout(function() {
              window._lingxiLoader.error('加载超时，请检查网络后刷新重试');
            }, 60000);
    })();

    // ── Web Speech API helper ──
    (function() {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      var _rec = null;
      window._lingxiSpeech = {
        supported: !!SR,
        start: function(lang) {
          if (!SR) { if (window._lingxiOnError) window._lingxiOnError('not_supported'); return; }
          if (_rec) { try { _rec.stop(); } catch(e){} _rec = null; }
          var rec = new SR();
          rec.lang = lang || 'zh-CN';
          rec.continuous = true;
          rec.interimResults = true;
          rec.maxAlternatives = 1;
          rec.onresult = function(ev) {
            var finalText = '', interimText = '';
            for (var i = ev.resultIndex; i < ev.results.length; i++) {
              var r = ev.results[i];
              if (r.isFinal) finalText += r[0].transcript;
              else interimText += r[0].transcript;
            }
            if (window._lingxiOnResult) {
              try { window._lingxiOnResult(finalText, interimText); } catch(e) { console.error('[lingxi-speech] callback error: ' + e); }
            }
          };
          rec.onerror = function(ev) { if (window._lingxiOnError) window._lingxiOnError(ev.error || 'error'); };
          rec.onend = function() { if (window._lingxiOnEnd) window._lingxiOnEnd(); };
          try { rec.start(); _rec = rec; } catch(e) { if (window._lingxiOnError) window._lingxiOnError('start_failed'); }
        },
        stop: function() { if (_rec) { try { _rec.stop(); } catch(e){} _rec = null; } }
      };
    })();
  </script>

  <script src="flutter_bootstrap.js"></script>
</body>
</html>
